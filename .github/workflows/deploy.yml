# Build the web app + the bootable PS2 ISO + the Switch homebrew NRO, then
# publish all three to GitHub Pages: https://easierbycode.com/shmup-party-ps2/
#   /                    Xbox-green download page
#   /play/               browser build (5velte-ps2 Phaser host)
#   /wave-editor/        the Wave Editor (authors ps2/data/waves.js)
#   /shmup-party-ps2.iso the AthenaEnv disc image (also a run artifact)
#   /shmup-party.nro     the Switch homebrew build (switch.yml, reusable)
#   /shmup-party-ps2-web.zip  the browser build at a relative base path, for
#                        launchers that install it under a folder of their
#                        own (the shmupX eShop) — scripts/build-launcher-zip.ts
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  nro:
    uses: ./.github/workflows/switch.yml

  build:
    needs: nro
    # The site is the only way the web build, the ISO, the Wave Editor and the
    # launcher zip reach anyone, and none of them are built here from devkitPro
    # — but the NRO is, against a package server with its own outages. A 403
    # from pkg.devkitpro.org on `dkp-pacman -Sy` failed two attempts of run 31
    # back to back, which skipped this job and left a merged change unpublished.
    # So the deploy no longer waits on the Switch build being possible: it runs
    # whatever the nro job did, and only the NRO itself goes missing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app + download page
        run: |
          npm ci
          npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build PS2 ISO
        run: deno run --allow-read --allow-write scripts/build-athena-iso.ts ps2 dist/shmup-party-ps2.iso

      - name: Build the launcher zip (relative base path, any mount point)
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/build-launcher-zip.ts dist/shmup-party-ps2-web.zip

      - name: Fetch Switch NRO from the nro job
        if: ${{ needs.nro.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: shmup-party-nro
          path: dist

      # No NRO this run: carry the published one forward so the download page's
      # Switch button keeps working instead of shipping a 404. Best effort — if
      # the live copy can't be fetched either, the rest of the site still goes.
      - name: Carry the published Switch NRO forward
        if: ${{ needs.nro.result != 'success' }}
        continue-on-error: true
        run: |
          echo "::warning title=Switch NRO not rebuilt::the nro job ended '${{ needs.nro.result }}' — publishing the previously deployed NRO"
          curl -fsSL --retry 3 --retry-delay 5 -o dist/shmup-party.nro \
            https://easierbycode.com/shmup-party-ps2/shmup-party.nro

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload ISO as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: shmup-party-ps2-iso
          path: dist/shmup-party-ps2.iso

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
