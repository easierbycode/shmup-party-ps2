# Build the Nintendo Switch homebrew NRO (switch/ host + ps2/ game tree).
# The NRO stays a private, retention-limited run artifact — the baked art is
# ripped (Crimsonland/Contra/Pac-Man), fine for personal homebrew on owned
# hardware, not for publication.
name: Switch NRO

on:
  push:
    branches: [main]
    paths:
      - 'ps2/**'
      - 'switch/**'
      - 'scripts/stage-switch-romfs.mjs'
      - '.github/workflows/switch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install SDL2 portlibs
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed switch-sdl2 switch-sdl2_image switch-sdl2_mixer switch-libpng switch-zlib

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage romfs
        run: node scripts/stage-switch-romfs.mjs

      - name: Build NRO
        run: make -C switch

      - uses: actions/upload-artifact@v4
        with:
          name: shmup-party-nro
          path: switch/shmup-party.nro
